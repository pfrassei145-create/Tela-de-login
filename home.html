<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">

  <meta name="theme-color" content="#4CAF50">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b34b8b, #f088eb);
      color: white;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.12);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: white;
      border: none;
      color: #b34b8b;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background: #00c6ff;
      color: white;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Bem-vinda!</h1>

    <p>
      Você está usando o aplicativo no modo PWA.
    </p>

    <button onclick="sair()">
      Sair
    </button>

  </div>

  <script>
    // Protege a página: se não estiver logado, redireciona para login
    if (sessionStorage.getItem('loggedIn') !== 'true') {
      window.location.href = 'login.html';
    }

    function sair() {
      // Limpa sessão e volta para a tela de login
      sessionStorage.removeItem('loggedIn');
      window.location.href = "login.html";
    }

    if ('serviceWorker' in navigator) {

      navigator.serviceWorker.register('./service-worker.js')

        .then(() => {
          console.log('Service Worker registrado');
        })

        .catch((error) => {
          console.log('Erro ao registrar:', error);
        });
    }

  </script>

</body>
</html>
