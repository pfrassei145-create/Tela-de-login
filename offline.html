<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b34b8b, #f088eb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 320px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #f147a5d5;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #00c6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Você está offline</h2>
    <p>O aplicativo está em modo offline. Verifique sua conexão ou volte mais tarde.</p>
    <button onclick="location.href='index.html'">Voltar para o início</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(function() {
          console.log("Service Worker registrado");
        })
        .catch(function(error) {
          console.log("Erro ao registrar:", error);
        });
    }
  </script>
</body>
</html>
