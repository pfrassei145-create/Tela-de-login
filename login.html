<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b34b8b, #f088eb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 300px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background: #f147a5d5;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-container button:hover {
      background: #00c6ff;
    }

    .login-container .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
    }
  </style>
</head>

<script>
  function fazerLogin(event) {
    event.preventDefault();

    const rm = document.getElementById("rm").value;
    const senha = document.getElementById("senha").value;

    // LOGIN SIMULADO
    const rmCorreto = "23728";
    const senhaCorreta = "1234";

    if (rm === rmCorreto && senha === senhaCorreta) {
      alert("Login realizado com sucesso!");

      // Redireciona (crie essa página depois)
      window.location.href = "home.html";
    } else {
      document.getElementById("mensagemErro").innerText = "RM ou senha inválidos!";
    }
  }
</script>

<body>

  <div class="login-container">
    <h2>Login</h2>
<form onsubmit="fazerLogin(event)">
  <input type="text" id="rm" placeholder="Digite seu RM" required>
  <input type="password" id="senha" placeholder="Digite sua senha" required>
  <button type="submit">Entrar</button>
</form>

<p id="mensagemErro" style="color:red; text-align:center;"></p>

    <div class="footer">
      <p>Esqueceu a senha?</p>
    </div>
  </div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(function() {
      console.log("Service Worker registrado");
    })
    .catch(function(error) {
      console.log("Erro ao registrar:", error);
    });
}
</script>
</body>
</html>
